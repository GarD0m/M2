[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm5-tpu"
version = "0.1.0"
description = "Five-layer Qwen3 pretraining curriculum for one TPU v6e"
requires-python = ">=3.12"
dependencies = [
  "datasets>=4,<6", "huggingface-hub>=0.34,<3", "numpy>=2,<3",
  "pyarrow>=20,<27", "pyyaml>=6,<7", "tokenizers>=0.22,<0.24",
  "transformers>=4.56,<6", "tqdm>=4.67,<5",
]

[tool.setuptools.packages.find]
include = ["llm5*"]

